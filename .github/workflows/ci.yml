name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    defaults:
      run:
        working-directory: democyber

    steps:
      # Étape 1 : Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Partie I : Gitleaks scan
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload Gitleaks report
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: '**/*.sarif'
          if-no-files-found: warn

      # Configuration Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compilation Java
      - name: Compile Java
        run: mvn compile

      # Build Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # Partie V : SonarCloud (après le build : target/classes doit exister)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: democyber
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.java.binaries=target/classes

      # Partie II : Build Docker image
      - name: Build Docker image
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      # Test de l'application Docker
      - name: Test Docker container
        run: |
          docker run -d --name democyber-test -p 8080:8080 "$DOCKER_IMAGE_NAME"

          trap 'docker rm -f democyber-test 2>/dev/null || true' EXIT

          for i in {1..15}; do
            if curl -fsS http://localhost:8080; then
              echo "Application Docker fonctionne correctement."
              exit 0
            fi
            echo "Attente du démarrage de l'application..."
            sleep 2
          done

          echo "Erreur : l'application ne répond pas."
          docker logs democyber-test
          exit 1

      # Partie III : Scan Docker image with Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Generate Trivy report (JSON)
      - name: Generate Trivy report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'json'
          output: 'democyber/trivy-report.json'
          exit-code: '0'

      # Upload Trivy report
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: democyber/trivy-report.json
          if-no-files-found: warn

      # Partie IV : Login Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push Docker image sur Docker Hub
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push "$DOCKER_IMAGE_NAME"